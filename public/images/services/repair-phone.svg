<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Tools Behind Phone -->
  <!-- Teal Screwdriver (Angle Left) -->
  <g transform="rotate(-30 50 65)">
    <rect x="46" y="10" width="8" height="55" rx="3" fill="#00a99d" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="48" y="65" width="4" height="40" fill="#94a3b8"/>
    <polygon points="48,105 52,105 51,110 49,110" fill="#475569"/>
  </g>

  <!-- Silver Wrench (Angle Right) -->
  <g transform="rotate(35 110 65)">
    <rect x="106" y="25" width="8" height="75" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <!-- Wrench Open Head -->
    <path d="M100 25 C100 15 120 15 120 25 L114 28 C114 22 106 22 106 28 Z" fill="#94a3b8"/>
  </g>

  <!-- Smartphone with Cracked Glass in Center -->
  <g transform="translate(52, 14)">
    <rect x="0" y="0" width="56" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="3" y="3" width="50" height="104" rx="9" fill="#020617"/>
    <!-- Dynamic island -->
    <rect x="18" y="6" width="20" height="5" rx="2.5" fill="#1e293b"/>

    <!-- Shattered Glass Spiderweb Cracks -->
    <path d="M25 45 L32 30 L45 25 M32 30 L20 18 M25 45 L10 55 L5 75 M25 45 L38 60 L48 58 M38 60 L30 85 L18 95 M38 60 L45 78 L52 90" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M25 45 L18 35 M32 30 L40 40 M38 60 L24 68 M30 85 L42 98" stroke="#38bdf8" stroke-width="1.2" opacity="0.75"/>
  </g>

  <!-- Small Gear Accent -->
  <circle cx="120" cy="40" r="10" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <circle cx="120" cy="40" r="4" fill="#f0f9f8"/>
</svg>
