<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Power Bank (Left Background) -->
  <g transform="translate(24, 40)">
    <rect x="0" y="0" width="36" height="65" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="10" y="8" width="16" height="4" rx="2" fill="#00a99d"/>
    <circle cx="12" cy="55" r="2" fill="#10b981"/>
    <circle cx="18" cy="55" r="2" fill="#10b981"/>
    <circle cx="24" cy="55" r="2" fill="#10b981"/>
  </g>

  <!-- Over-Ear Headband & Earcups (Center/Back) -->
  <g transform="translate(52, 22)">
    <!-- Arch Headband -->
    <path d="M12 45 C12 10 52 10 52 45" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M12 45 C12 10 52 10 52 45" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Left Earcup -->
    <ellipse cx="12" cy="52" rx="10" ry="16" fill="#0f172a" stroke="#00a99d" stroke-width="2"/>
    <!-- Right Earcup -->
    <ellipse cx="52" cy="52" rx="10" ry="16" fill="#0f172a" stroke="#00a99d" stroke-width="2"/>
  </g>

  <!-- Smartwatch in Foreground -->
  <g transform="translate(68, 65)">
    <path d="M12 0 L12 46 M28 0 L28 46" stroke="#00a99d" stroke-width="6" stroke-linecap="round"/>
    <rect x="6" y="8" width="28" height="30" rx="7" fill="#0f172a" stroke="#00a99d" stroke-width="1.5"/>
    <circle cx="20" cy="23" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Wireless Earbuds Case (Right) -->
  <g transform="translate(110, 68)">
    <rect x="0" y="0" width="30" height="36" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="30" y2="14" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="15" cy="24" r="2" fill="#10b981"/>
  </g>
</svg>
