<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Currency Notes Fan in Background -->
  <g transform="rotate(18 100 70)">
    <rect x="70" y="30" width="65" height="36" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
    <circle cx="102" cy="48" r="10" fill="#6ee7b7" opacity="0.6"/>
    <text x="76" y="44" font-size="8" font-family="sans-serif" font-weight="bold" fill="#047857">₹500</text>
    <text x="116" y="60" font-size="7" font-family="sans-serif" font-weight="bold" fill="#047857">₹</text>
  </g>
  <g transform="rotate(28 110 75)">
    <rect x="80" y="32" width="65" height="36" rx="4" fill="#6ee7b7" stroke="#047857" stroke-width="1.5"/>
    <circle cx="112" cy="50" r="10" fill="#34d399" opacity="0.6"/>
    <text x="86" y="46" font-size="8" font-family="sans-serif" font-weight="bold" fill="#065f46">₹500</text>
  </g>
  <g transform="rotate(38 118 80)">
    <rect x="90" y="34" width="65" height="36" rx="4" fill="#34d399" stroke="#065f46" stroke-width="1.5"/>
    <circle cx="122" cy="52" r="10" fill="#10b981" opacity="0.6"/>
    <text x="96" y="48" font-size="8" font-family="sans-serif" font-weight="bold" fill="#064e3b">₹500</text>
  </g>

  <!-- Smartphone in Foreground -->
  <rect x="25" y="16" width="58" height="108" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="20" width="52" height="100" rx="9" fill="url(#phoneScreen)"/>
  
  <!-- Dynamic Island / Punch Hole -->
  <rect x="46" y="23" width="16" height="4.5" rx="2.2" fill="#020617"/>
  
  <!-- Gloss highlight -->
  <path d="M28 20 Q54 60 28 100 L28 20 Z" fill="white" opacity="0.12"/>
  
  <!-- Gold Coins at Bottom -->
  <circle cx="95" cy="108" r="10" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="95" cy="108" r="7" fill="#f59e0b"/>
  <text x="92" y="112" font-size="10" font-family="sans-serif" font-weight="bold" fill="#78350f">₹</text>

  <circle cx="110" cy="112" r="9" fill="#fde047" stroke="#d97706" stroke-width="1.5"/>
  <text x="107" y="115" font-size="9" font-family="sans-serif" font-weight="bold" fill="#78350f">₹</text>

  <defs>
    <linearGradient id="phoneScreen" x1="28" y1="20" x2="80" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
