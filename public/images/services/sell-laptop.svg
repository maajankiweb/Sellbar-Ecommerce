<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Soft Shadow -->
  <ellipse cx="80" cy="116" rx="60" ry="8" fill="#0f172a" opacity="0.12" filter="blur(4px)"/>

  <!-- Laptop Display Lid (Upright) -->
  <g transform="translate(30, 24)">
    <!-- Bezel -->
    <rect x="6" y="0" width="88" height="60" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Screen Display -->
    <rect x="9" y="3" width="82" height="54" rx="3" fill="url(#laptopScreenFluid)"/>
    <!-- Webcam dot -->
    <circle cx="50" cy="1.5" r="1" fill="#64748b"/>
    <!-- Vibrant Bubbles/Fluid Artwork -->
    <circle cx="28" cy="30" r="14" fill="#38bdf8" opacity="0.8"/>
    <circle cx="52" cy="22" r="16" fill="#f472b6" opacity="0.75"/>
    <circle cx="70" cy="38" r="12" fill="#818cf8" opacity="0.85"/>
    <circle cx="42" cy="40" r="10" fill="#fbbf24" opacity="0.7"/>
    <!-- Gloss highlight -->
    <path d="M9 3 L91 3 L9 57 Z" fill="white" opacity="0.08"/>
  </g>

  <!-- Laptop Base (Keyboard & Trackpad) -->
  <g transform="translate(18, 83)">
    <!-- Base Chassis -->
    <path d="M12 0 L112 0 L124 16 L0 16 Z" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <!-- Keyboard Area -->
    <polygon points="18,2 106,2 112,8 12,8" fill="#1e293b"/>
    <!-- Trackpad -->
    <rect x="48" y="9" width="28" height="5.5" rx="1" fill="#334155"/>
  </g>

  <!-- Floating Gold Coins (as in Cashify screenshot) -->
  <!-- Coin 1 (Left top) -->
  <g transform="translate(24, 28)">
    <circle cx="8" cy="8" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.2"/>
    <circle cx="8" cy="8" r="5" fill="#f59e0b"/>
    <text x="5.5" y="11" font-size="8" font-family="sans-serif" font-weight="bold" fill="#78350f">₹</text>
  </g>
  <!-- Coin 2 (Left bottom near keyboard) -->
  <g transform="translate(18, 86)">
    <circle cx="7" cy="7" r="6" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <circle cx="7" cy="7" r="4" fill="#f59e0b"/>
    <text x="5" y="9.5" font-size="7" font-family="sans-serif" font-weight="bold" fill="#78350f">₹</text>
  </g>
  <!-- Coin 3 (Right bottom) -->
  <g transform="translate(126, 76)">
    <circle cx="8" cy="8" r="7.5" fill="#fbbf24" stroke="#d97706" stroke-width="1.2"/>
    <circle cx="8" cy="8" r="5.5" fill="#f59e0b"/>
    <text x="5.5" y="11" font-size="8.5" font-family="sans-serif" font-weight="bold" fill="#78350f">₹</text>
  </g>

  <defs>
    <linearGradient id="laptopScreenFluid" x1="9" y1="3" x2="91" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
</svg>
