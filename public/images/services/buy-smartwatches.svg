<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Left Smartwatch (Sport Black) -->
  <g transform="translate(32, 20)">
    <!-- Silicone Black Strap -->
    <path d="M12 0 L12 96 M32 0 L32 96" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <!-- Watch Case -->
    <rect x="6" y="24" width="32" height="42" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="9" y="27" width="26" height="36" rx="7" fill="#020617"/>
    <!-- Digital Time / Fitness Rings -->
    <circle cx="22" cy="45" r="9" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="40 20"/>
    <circle cx="22" cy="45" r="6" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="25 15"/>
    <circle cx="22" cy="45" r="3" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 10"/>
    <!-- Digital Crown Button -->
    <rect x="38" y="36" width="3" height="8" rx="1" fill="#475569"/>
  </g>

  <!-- Right Smartwatch (Gold / Cream Ultra Edition) -->
  <g transform="translate(82, 34)">
    <!-- Cream / Orange Alpine Loop Strap -->
    <path d="M14 0 L14 86 M34 0 L34 86" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
    <!-- Titanium Gold Case -->
    <rect x="8" y="20" width="32" height="42" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="11" y="23" width="26" height="36" rx="7" fill="#0f172a"/>
    <!-- Analog Watch Hands -->
    <circle cx="24" cy="41" r="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="24" y1="41" x2="24" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="41" x2="29" y2="41" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Crown -->
    <rect x="40" y="32" width="3.5" height="9" rx="1" fill="#ea580c"/>
  </g>
</svg>
