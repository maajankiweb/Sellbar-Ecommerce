<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Laptop Display Lid (Upright) -->
  <g transform="translate(25, 20)">
    <!-- Bezel -->
    <rect x="10" y="0" width="90" height="62" rx="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Screen Display -->
    <rect x="13" y="3" width="84" height="56" rx="4" fill="url(#laptopScreenVibrant)"/>
    <!-- Webcam dot -->
    <circle cx="55" cy="1.5" r="1" fill="#475569"/>
    <!-- Dynamic Wave Graphic on Screen -->
    <path d="M13 35 Q35 15 55 38 T97 25 L97 59 L13 59 Z" fill="#06b6d4" opacity="0.8"/>
    <path d="M13 45 Q40 25 70 45 T97 40 L97 59 L13 59 Z" fill="#3b82f6" opacity="0.6"/>
  </g>

  <!-- Laptop Base (Keyboard & Trackpad) -->
  <g transform="translate(14, 82)">
    <!-- Base Chassis -->
    <path d="M11 0 L121 0 L132 18 L0 18 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Keyboard Well -->
    <polygon points="20,2 112,2 118,10 14,10" fill="#1e293b"/>
    <!-- Trackpad -->
    <rect x="52" y="11" width="28" height="5.5" rx="1.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Front Notch -->
    <rect x="60" y="17" width="12" height="1" rx="0.5" fill="#64748b"/>
  </g>

  <defs>
    <linearGradient id="laptopScreenVibrant" x1="13" y1="3" x2="97" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
</svg>
