<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Small Gear Left -->
  <circle cx="28" cy="100" r="10" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <circle cx="28" cy="100" r="4" fill="#f0f9f8"/>

  <!-- Top Right Gear -->
  <circle cx="126" cy="32" r="13" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="126" cy="32" r="5" fill="#f0f9f8"/>

  <!-- Laptop Display with Broken Screen -->
  <g transform="translate(30, 22)">
    <rect x="5" y="0" width="90" height="62" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="8" y="3" width="84" height="56" rx="4" fill="#020617"/>

    <!-- Crack Lines Across Laptop Display -->
    <path d="M45 28 L35 15 L18 8 M45 28 L58 12 L72 10 M45 28 L38 42 L22 48 M45 28 L56 38 L68 52 M56 38 L48 55" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 28 L42 20 M35 15 L28 22 M56 38 L62 32 M38 42 L28 38" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- Laptop Base -->
  <g transform="translate(18, 84)">
    <path d="M12 0 L112 0 L124 16 L0 16 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="20,2 104,2 110,9 14,9" fill="#1e293b"/>
    <rect x="52" y="10" width="22" height="4" rx="1" fill="#cbd5e1"/>
  </g>

  <!-- Screwdriver crossing over -->
  <g transform="rotate(45 95 65)">
    <rect x="85" y="10" width="6" height="40" rx="2" fill="#00a99d"/>
    <rect x="86.5" y="50" width="3" height="30" fill="#94a3b8"/>
  </g>
</svg>
