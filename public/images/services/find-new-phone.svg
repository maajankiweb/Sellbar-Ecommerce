<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Smartphone in Background -->
  <g transform="translate(42, 16)">
    <rect x="0" y="0" width="56" height="108" rx="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="3" y="3" width="50" height="102" rx="9" fill="url(#findNewScreen)"/>
    <!-- Punch hole camera -->
    <circle cx="28" cy="10" r="2.5" fill="#020617"/>
    <!-- Phone specs chart lines on screen -->
    <rect x="8" y="24" width="34" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="8" y="32" width="26" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
    <rect x="8" y="38" width="30" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Large Orange Magnifying Glass Inspecting Phone -->
  <g transform="translate(68, 38)">
    <!-- Lens Frame -->
    <circle cx="28" cy="28" r="24" fill="#38bdf8" fill-opacity="0.2" stroke="#f97316" stroke-width="5"/>
    <!-- Glass Highlight reflection -->
    <path d="M14 20 A18 18 0 0 1 36 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Magnifying Glass Handle -->
    <g transform="rotate(45 28 28)">
      <rect x="25" y="52" width="6" height="36" rx="3" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
      <rect x="24" y="50" width="8" height="5" rx="1" fill="#f97316"/>
    </g>

    <!-- Checkmark inside lens -->
    <path d="M20 28 L26 34 L38 20" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <defs>
    <linearGradient id="findNewScreen" x1="3" y1="3" x2="53" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>
