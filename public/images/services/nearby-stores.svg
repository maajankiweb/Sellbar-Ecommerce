<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Store Base / Sidewalk -->
  <rect x="22" y="112" width="116" height="10" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Storefront Building Main Block -->
  <g transform="translate(32, 28)">
    <!-- Building Body -->
    <rect x="4" y="24" width="88" height="60" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>

    <!-- Signboard Header -->
    <rect x="0" y="8" width="96" height="18" rx="4" fill="#00a99d" stroke="#0f766e" stroke-width="1.5"/>
    <text x="48" y="21" font-size="9" font-family="sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SELBAR STORE</text>

    <!-- Striped Awning / Canopy -->
    <g transform="translate(0, 24)">
      <!-- Stripes: alternating Teal and White -->
      <path d="M0 0 L12 0 L10 14 L0 14 Z" fill="#00a99d"/>
      <path d="M12 0 L24 0 L22 14 L10 14 Z" fill="#ffffff"/>
      <path d="M24 0 L36 0 L34 14 L22 14 Z" fill="#00a99d"/>
      <path d="M36 0 L48 0 L46 14 L34 14 Z" fill="#ffffff"/>
      <path d="M48 0 L60 0 L58 14 L46 14 Z" fill="#00a99d"/>
      <path d="M60 0 L72 0 L70 14 L58 14 Z" fill="#ffffff"/>
      <path d="M72 0 L84 0 L82 14 L70 14 Z" fill="#00a99d"/>
      <path d="M84 0 L96 0 L96 14 L82 14 Z" fill="#ffffff"/>
      <!-- Scalloped lower edge -->
      <line x1="0" y1="14" x2="96" y2="14" stroke="#00a99d" stroke-width="2"/>
    </g>

    <!-- Double Glass Entrance Doors -->
    <rect x="34" y="44" width="28" height="40" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="48" y1="44" x2="48" y2="84" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="44" y="62" width="2" height="6" rx="1" fill="#0369a1"/>
    <rect x="50" y="62" width="2" height="6" rx="1" fill="#0369a1"/>

    <!-- Left Display Window -->
    <rect x="10" y="46" width="18" height="24" rx="2" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14" y="52" width="10" height="14" rx="2" fill="#0f172a"/> <!-- Phone display inside -->

    <!-- Right Display Window -->
    <rect x="68" y="46" width="18" height="24" rx="2" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="71" y="55" width="12" height="8" rx="1.5" fill="#0f172a"/> <!-- Laptop display inside -->
  </g>
</svg>
