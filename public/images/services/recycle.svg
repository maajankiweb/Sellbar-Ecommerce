<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Old Gadgets Overflowing from Top -->
  <!-- Old Phone 1 (Tilted Left) -->
  <g transform="rotate(-15 65 35)">
    <rect x="52" y="16" width="22" height="40" rx="4" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <rect x="54" y="19" width="18" height="32" rx="2" fill="#0f172a"/>
  </g>
  <!-- Old Phone 2 (Tilted Right) -->
  <g transform="rotate(22 95 35)">
    <rect x="85" y="14" width="20" height="38" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="87" y="17" width="16" height="30" rx="2" fill="#020617"/>
  </g>
  <!-- Tablet Peeking Out (Center) -->
  <rect x="64" y="10" width="34" height="28" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="1"/>

  <!-- Green Recycling Wheelie Bin Body -->
  <g transform="translate(48, 38)">
    <!-- Bin Lid -->
    <path d="M-6 0 L70 0 L66 8 L-2 8 Z" fill="#059669" stroke="#047857" stroke-width="1.5"/>
    <rect x="24" y="-3" width="16" height="3" rx="1.5" fill="#047857"/>

    <!-- Tapered Bin Container Body -->
    <polygon points="2,8 62,8 54,76 10,76" fill="#10b981" stroke="#059669" stroke-width="2"/>
    <!-- Vertical Rib lines -->
    <line x1="22" y1="12" x2="24" y2="72" stroke="#059669" stroke-width="1.5"/>
    <line x1="32" y1="12" x2="32" y2="72" stroke="#059669" stroke-width="1.5"/>
    <line x1="42" y1="12" x2="40" y2="72" stroke="#059669" stroke-width="1.5"/>

    <!-- Recycle Symbol in White (Center of Bin) -->
    <g transform="translate(23, 28) scale(0.75)">
      <path d="M12 2 L16 8 L13 8 C15 13 18 16 22 17 L21 19 C16 18 13 14 11 8 L8 8 Z" fill="#ffffff"/>
      <path d="M24 16 L22 22 L20 20 C16 23 11 23 7 21 L8 19 C11 21 15 21 18 19 L16 17 Z" fill="#ffffff"/>
      <path d="M4 14 L0 10 L2 8 C-1 4 1 0 5 -2 L6 0 C3 2 1 5 3 8 L6 6 Z" fill="#ffffff"/>
    </g>

    <!-- Wheels at Base -->
    <circle cx="8" cy="76" r="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="8" cy="76" r="2.5" fill="#94a3b8"/>
    <circle cx="56" cy="76" r="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="56" cy="76" r="2.5" fill="#94a3b8"/>
  </g>
</svg>
