name: Sellbar CI/CD & Security Verification

on:
  push:
    branches: [ "main", "phase-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Lint, Brand Check, Security Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Brand Integrity Grep Check
        run: npm run check:brand

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Product Slug Smoke Test
        run: npm run test:smoke

      - name: Run Cryptographic & Auth Security Suite
        run: npm run test:auth
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          OTP_HMAC_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789

      - name: Next.js Production Build
        run: npm run build
